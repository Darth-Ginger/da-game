<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SUBLEVEL 3</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }
    #app { position: fixed; inset: 0; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #cfe3cf;
      font-family: "Courier New", Courier, monospace;
      text-shadow: 0 0 6px rgba(180, 255, 200, 0.55), 1px 0 0 rgba(255, 60, 60, 0.25), -1px 0 0 rgba(60, 120, 255, 0.25);
      user-select: none;
      z-index: 10;
    }
    .screen.hidden { display: none; }
    .screen h1 {
      font-size: clamp(26px, 5vw, 54px);
      font-weight: bold;
      letter-spacing: 0.35em;
      margin: 0 0 8px 0;
    }
    .screen .sub {
      font-size: clamp(11px, 1.6vw, 16px);
      letter-spacing: 0.25em;
      opacity: 0.7;
      margin-bottom: 42px;
    }
    .screen .play {
      font-size: clamp(16px, 2.4vw, 26px);
      letter-spacing: 0.3em;
      animation: blink 1.1s steps(2, start) infinite;
      margin-bottom: 48px;
    }
    .screen .controls {
      font-size: clamp(10px, 1.4vw, 14px);
      letter-spacing: 0.18em;
      opacity: 0.55;
      line-height: 2;
      text-align: center;
    }
    .screen .warn {
      position: absolute;
      bottom: 4vh;
      font-size: 10px;
      letter-spacing: 0.3em;
      opacity: 0.35;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- workstation interaction ---- */
    #interactPrompt {
      position: fixed;
      left: 50%;
      bottom: 18vh;
      transform: translateX(-50%);
      padding: 10px 20px;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(13px, 1.8vw, 17px);
      letter-spacing: 0.22em;
      color: #cfe3cf;
      background: rgba(0, 0, 0, 0.45);
      border: 2px solid rgba(200, 230, 205, 0.45);
      border-radius: 4px;
      text-shadow: 0 0 6px rgba(180, 255, 200, 0.6);
      z-index: 6;
      cursor: pointer;
    }
    #interactPrompt.hidden { display: none; }

    #terminal {
      position: fixed;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      width: min(760px, 92vw);
      height: min(480px, 76vh);
      background: #041006;
      border: 3px solid #1a3a22;
      border-radius: 10px;
      box-shadow: 0 0 60px rgba(30, 255, 120, 0.18), inset 0 0 80px rgba(0, 0, 0, 0.85);
      z-index: 8;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    #terminal.hidden { display: none; }
    #terminal::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(120, 255, 160, 0.045) 0px,
        rgba(120, 255, 160, 0.045) 1px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0) 3px
      );
    }
    #termScroll {
      flex: 1;
      overflow-y: auto;
      padding: 18px 22px 6px 22px;
      font-family: "Courier New", Courier, monospace;
      font-size: clamp(11px, 1.5vw, 15px);
      line-height: 1.35;
      color: #8fe3a2;
      text-shadow: 0 0 5px rgba(120, 255, 160, 0.55);
      scrollbar-width: none;
    }
    #termScroll::-webkit-scrollbar { display: none; }
    #termText {
      margin: 0;
      white-space: pre-wrap;
      word-break: break-all;
      font: inherit;
    }
    #termLine { white-space: pre-wrap; word-break: break-all; }
    #termCursor {
      display: inline-block;
      width: 0.62em;
      height: 1em;
      vertical-align: text-bottom;
      background: #8fe3a2;
      box-shadow: 0 0 6px rgba(120, 255, 160, 0.8);
      animation: blink 1.05s steps(2, start) infinite;
    }
    #termClose {
      padding: 8px 22px 10px 22px;
      font-family: "Courier New", Courier, monospace;
      font-size: 11px;
      letter-spacing: 0.28em;
      color: rgba(143, 227, 162, 0.55);
      text-align: right;
      cursor: pointer;
      user-select: none;
    }
    #termKbd {
      position: absolute;
      opacity: 0;
      width: 1px;
      height: 1px;
      left: -100px;
      top: 0;
      border: 0;
      padding: 0;
    }

    /* ---- touch controls (shown only on touch devices, in-game) ---- */
    #touchUI { display: none; }
    body.touch-playing #touchUI { display: block; }
    #joyBase {
      display: none;
      position: fixed;
      width: 128px;
      height: 128px;
      margin: -64px 0 0 -64px;
      border: 2px solid rgba(200, 230, 205, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    #joyKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(200, 230, 205, 0.55);
      background: rgba(200, 230, 205, 0.12);
      border-radius: 50%;
    }
    #btnLight {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      padding: 14px 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: #cfe3cf;
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(200, 230, 205, 0.4);
      border-radius: 6px;
      text-shadow: 0 0 6px rgba(180, 255, 200, 0.55);
      z-index: 5;
    }

    #startScreen::after, #pauseScreen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0) 4px
      );
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="startScreen" class="screen">
    <h1>SUBLEVEL&nbsp;3</h1>
    <div class="sub">FACILITY CAMERA &mdash; TAPE 07</div>
    <div class="play" id="playPrompt">&#9654; CLICK TO INSERT TAPE</div>
    <div class="controls" id="controlsHint">
      W A S D &mdash; MOVE&emsp;&emsp;MOUSE &mdash; LOOK<br />
      SHIFT &mdash; RUN&emsp;&emsp;F &mdash; CAMERA LIGHT&emsp;&emsp;ESC &mdash; PAUSE<br />
      HEADPHONES RECOMMENDED
    </div>
    <div class="warn">PROPERTY OF FACILITIES MGMT &mdash; DO NOT DISTRIBUTE</div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <h1>&#10074;&#10074; PAUSE</h1>
    <div class="play">&#9654; CLICK TO RESUME</div>
  </div>

  <div id="touchUI">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button id="btnLight">&#9788; LIGHT</button>
  </div>

  <div id="interactPrompt" class="hidden">[E] INSPECT TERMINAL</div>

  <div id="terminal" class="hidden">
    <div id="termScroll">
      <pre id="termText"></pre>
      <div id="termLine"><span id="termPrompt">&gt; </span><span id="termInput"></span><span id="termCursor"></span></div>
    </div>
    <div id="termClose">[ESC] STEP AWAY</div>
    <input id="termKbd" autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false" />
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
