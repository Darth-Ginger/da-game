<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <title>SUBLEVEL 3</title>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #000;
      overflow: hidden;
      cursor: default;
      touch-action: none;
      -webkit-user-select: none;
      user-select: none;
    }
    canvas { display: block; }
    #app { position: fixed; inset: 0; }

    .screen {
      position: fixed;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: #000;
      color: #cfe3cf;
      font-family: "Courier New", Courier, monospace;
      text-shadow: 0 0 6px rgba(180, 255, 200, 0.55), 1px 0 0 rgba(255, 60, 60, 0.25), -1px 0 0 rgba(60, 120, 255, 0.25);
      user-select: none;
      z-index: 10;
    }
    .screen.hidden { display: none; }
    .screen h1 {
      font-size: clamp(26px, 5vw, 54px);
      font-weight: bold;
      letter-spacing: 0.35em;
      margin: 0 0 8px 0;
    }
    .screen .sub {
      font-size: clamp(11px, 1.6vw, 16px);
      letter-spacing: 0.25em;
      opacity: 0.7;
      margin-bottom: 42px;
    }
    .screen .play {
      font-size: clamp(16px, 2.4vw, 26px);
      letter-spacing: 0.3em;
      animation: blink 1.1s steps(2, start) infinite;
      margin-bottom: 48px;
    }
    .screen .controls {
      font-size: clamp(10px, 1.4vw, 14px);
      letter-spacing: 0.18em;
      opacity: 0.55;
      line-height: 2;
      text-align: center;
    }
    .screen .warn {
      position: absolute;
      bottom: 4vh;
      font-size: 10px;
      letter-spacing: 0.3em;
      opacity: 0.35;
    }
    @keyframes blink { 50% { opacity: 0; } }

    /* ---- touch controls (shown only on touch devices, in-game) ---- */
    #touchUI { display: none; }
    body.touch-playing #touchUI { display: block; }
    #joyBase {
      display: none;
      position: fixed;
      width: 128px;
      height: 128px;
      margin: -64px 0 0 -64px;
      border: 2px solid rgba(200, 230, 205, 0.35);
      border-radius: 50%;
      pointer-events: none;
      z-index: 5;
    }
    #joyKnob {
      position: absolute;
      left: 50%;
      top: 50%;
      width: 52px;
      height: 52px;
      transform: translate(-50%, -50%);
      border: 2px solid rgba(200, 230, 205, 0.55);
      background: rgba(200, 230, 205, 0.12);
      border-radius: 50%;
    }
    #btnLight {
      position: fixed;
      right: max(18px, env(safe-area-inset-right));
      bottom: max(22px, env(safe-area-inset-bottom));
      padding: 14px 18px;
      font-family: "Courier New", Courier, monospace;
      font-size: 13px;
      letter-spacing: 0.22em;
      color: #cfe3cf;
      background: rgba(0, 0, 0, 0.35);
      border: 2px solid rgba(200, 230, 205, 0.4);
      border-radius: 6px;
      text-shadow: 0 0 6px rgba(180, 255, 200, 0.55);
      z-index: 5;
    }

    #startScreen::after, #pauseScreen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      background: repeating-linear-gradient(
        to bottom,
        rgba(255, 255, 255, 0.035) 0px,
        rgba(255, 255, 255, 0.035) 1px,
        rgba(0, 0, 0, 0) 2px,
        rgba(0, 0, 0, 0) 4px
      );
    }
  </style>
</head>
<body>
  <div id="app"></div>

  <div id="startScreen" class="screen">
    <h1>SUBLEVEL&nbsp;3</h1>
    <div class="sub">FACILITY CAMERA &mdash; TAPE 07</div>
    <div class="play" id="playPrompt">&#9654; CLICK TO INSERT TAPE</div>
    <div class="controls" id="controlsHint">
      W A S D &mdash; MOVE&emsp;&emsp;MOUSE &mdash; LOOK<br />
      SHIFT &mdash; RUN&emsp;&emsp;F &mdash; CAMERA LIGHT&emsp;&emsp;ESC &mdash; PAUSE<br />
      HEADPHONES RECOMMENDED
    </div>
    <div class="warn">PROPERTY OF FACILITIES MGMT &mdash; DO NOT DISTRIBUTE</div>
  </div>

  <div id="pauseScreen" class="screen hidden">
    <h1>&#10074;&#10074; PAUSE</h1>
    <div class="play">&#9654; CLICK TO RESUME</div>
  </div>

  <div id="touchUI">
    <div id="joyBase"><div id="joyKnob"></div></div>
    <button id="btnLight">&#9788; LIGHT</button>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
